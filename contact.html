<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get a free costing | Bangladesh knitwear sourcing | 7veins</title>
<meta name="description" content="Send a brief for one knitwear style and get factory options and a cost sheet by email.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="7veins">
<meta property="og:title" content="Get a free costing | Bangladesh knitwear sourcing | 7veins">
<meta property="og:description" content="Send a brief for one knitwear style and get factory options and a cost sheet by email.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="Get a costing">
<div class="wrap">
<header id="site-header"></header>
<main>
<div class="pagehead"><p class="eyebrow">Get a costing</p><h1 style="margin-top:10px">Describe one style. Send it. Costing in <span data-s="costingTime"></span>.</h1></div>
<section>
  <div class="two">
    <div>
      <div class="form">
        <div><label for="f-brand">Brand</label><input id="f-brand" type="text" placeholder="Your brand name"></div>
        <div><label for="f-name">Your name</label><input id="f-name" type="text" placeholder="Your name"></div>
        <div class="full"><label for="f-email">Your email (so I can reply)</label><input id="f-email" type="email" placeholder="you@yourbrand.com" autocomplete="email"></div>
        <div><label for="f-style">Style</label>
          <select id="f-style"><option>Crewneck sweater</option><option>Cardigan</option><option>T-shirt</option><option>Polo</option><option>Hoodie</option><option>Other knit</option></select></div>
        <div><label for="f-qty">Pieces per style</label><input id="f-qty" type="number" min="500" step="100" value="1000" inputmode="numeric"></div>
        <div><label for="f-fob">Target FOB (US$ / pc)</label><input id="f-fob" type="number" min="0" step="0.1" placeholder="e.g. 9.50" inputmode="decimal"></div>
        <div><label for="f-date">Delivery needed by</label><input id="f-date" type="date"></div>
        <input type="text" id="f-gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
        <div class="full"><label for="f-fibre">Fibre and certification</label><input id="f-fibre" type="text" placeholder="e.g. 100% BCI cotton, 20/2Ne, GOTS if possible"></div>
        <div class="full"><label for="f-notes">Anything else I should know (optional)</label><textarea id="f-notes" style="min-height:90px;font-family:var(--body);font-size:1rem" placeholder="Gauge, colours, trims, current supplier, links to photos or a tech pack"></textarea></div>
      </div>
      <div class="row"><button class="btn" id="send" type="button" hidden>Send request</button><span class="status" id="st" role="status"></span></div>
    </div>
    <div>
      <h3>What happens next</h3>
      <ol style="color:var(--muted);padding-left:1.2em;margin:12px 0 0">
        <li>You send this form.</li>
        <li>Within <span data-s="costingTime"></span> you get factory options and a cost sheet by email.</li>
        <li>If you like it, we run one paid sample round.</li>
      </ol>
      <div class="contact">
        <span>Prefer to write directly?</span>
        <span>Email <code data-s="email"></code></span>
        <span id="wa" hidden>WhatsApp <code data-s="whatsapp"></code></span>
        <span>LinkedIn <a id="li" target="_blank" rel="noopener"></a></span>
      </div>
    </div>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
</div>
<script src="settings.js"></script>
<script src="site.js"></script>
</body>
</html>
